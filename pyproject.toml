[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "order-desk"
version = "0.1.0"
description = "Internal order management dashboard for high-volume dry cleaning operations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "alembic>=1.13,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.27,<1",
  "pytest-asyncio>=0.24,<1",
  "bandit>=1.8,<2",
  "pip-audit>=2.7,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/order_desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
