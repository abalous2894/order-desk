# Optional overlay for Docker secret files (production):
#   mkdir -p secrets
#   cp secrets/postgres_password.example secrets/postgres_password
#   cp secrets/operator_token.example secrets/operator_token
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up --build

services:
  db:
    secrets:
      - postgres_password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

  api:
    secrets:
      - operator_token
    environment:
      OPERATOR_TOKEN_FILE: /run/secrets/operator_token

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  operator_token:
    file: ./secrets/operator_token
